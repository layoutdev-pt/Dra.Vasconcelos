<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicons & App Icons (proporção 1:1 quadrada recomendada pelo Google) -->
    <link rel="icon" type="image/svg+xml" href="/public/simple.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- O site tem tema claro e escuro próprios. Estas metas dizem-no ao
         browser e às extensões/apps de modo escuro (Dark Reader, Noir, ...)
         para que não apliquem um filtro por cima, que desconfigura o layout
         e parte os elementos `position: fixed` (modais, WhatsApp, navbar). -->
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <meta name="darkreader-lock" />
    <meta name="theme-color" content="#f9fafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#030712" media="(prefers-color-scheme: dark)" />

    <!-- Aplica o tema antes do primeiro paint: evita o flash de tema claro e
         garante que as extensões vêem logo o modo escuro nativo do site. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var theme = saved === 'dark' || saved === 'light'
            ? saved
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.classList.add(theme);
        } catch (e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>

    <meta name="google-site-verification" content="AmtdYaeBYHGnq0B0Tu8PGyfjdZIUkhvaDrEjUq1pkqM" />

    <title>Dra. Alexandra Vasconcelos</title>

    <meta name="description" content="Ajudo a melhorar saúde, energia e vitalidade através de uma abordagem integrativa e personalizada, focada na causa e no equilíbrio do organismo." />

    <!-- Open Graph Global (Fallback) -->
    <meta property="og:title" content="Dra. Alexandra Vasconcelos" />
    <meta property="og:description" content="Saúde Integrativa e Biológica" />
    <meta property="og:type" content="website" />
    <!-- O URL tem obrigatoriamente de ser absoluto. Substitua pelo domínio real. Caminhos locais falharão. -->
    <meta property="og:image" content="https://www.draalexandravasconcelos.pt/images/logo_preview.jpeg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
